<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">

  <title>Areeb Ahmed | Mechanical Engineer · Carbon Capture</title>
  <meta name="description" content="Areeb Ahmed: mechanical engineer designing and scaling Direct Air Capture and carbon-capture hardware. Experience, education, portfolio, skills and accolades.">
  <link rel="icon" href="assets/monogram.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400..700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=6">
  <script>
    // Apply saved theme before paint to avoid a flash
    try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar" id="topbar">
    <a class="brand" href="#experience" aria-label="Home">
      <img src="assets/monogram.svg" alt="" width="36" height="36">
      <span class="brand-name" data-bind="name"></span>
    </a>
    <div class="topbar-actions">
      <nav class="social" id="social" aria-label="Profiles"></nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">
        <span class="sun"></span><span class="moon"></span>
      </button>
    </div>
  </header>

  <section class="hero" id="hero">
    <!-- Blueprint background: DAC reactor vessel, steam piping isometric, flange detail, title block -->
    <svg class="blueprint" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <pattern id="bp-minor" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" class="bp-grid-minor"/></pattern>
        <pattern id="bp-major" width="100" height="100" patternUnits="userSpaceOnUse"><rect width="100" height="100" fill="url(#bp-minor)"/><path d="M100 0H0V100" class="bp-grid-major"/></pattern>
        <pattern id="bp-hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0V10" class="bp-thin"/></pattern>
        <marker id="bp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1L10 5L0 9Z" class="bp-fill"/></marker>
      </defs>
      <rect class="bp-paper" width="1600" height="900" fill="url(#bp-major)"/>

      <g class="ink">
        <!-- Reactor vessel (elevation) -->
        <path d="M180 260V640M340 260V640"/>
        <path d="M180 260A80 40 0 0 1 340 260M180 640A80 40 0 0 0 340 640"/>
        <path d="M180 282H340M180 618H340" class="bp-thin"/>
        <rect x="190" y="400" width="140" height="120" fill="url(#bp-hatch)"/>
        <path d="M250 220V200M270 220V200M240 200H280M240 194H280" />
        <path d="M340 322H392M340 338H392M392 310V350M398 310V350"/>
        <path d="M180 562H128M180 578H128M128 550V590M122 550V590"/>
        <path d="M200 668V744M320 668V744M176 744H344"/>
        <path d="M260 140V790" class="bp-center"/>
        <path d="M120 260V640" class="bp-dim" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)"/>
        <path d="M110 260H176M110 640H176" class="bp-thin"/>
        <path d="M180 170H340" class="bp-dim" marker-start="url(#bp-arrow)" marker-end="url(#bp-arrow)"/>
        <path d="M180 162V250M340 162V250" class="bp-thin"/>
        <path d="M330 470L430 430H470" class="bp-thin"/>
        <circle cx="486" cy="430" r="16"/>

        <!-- Steam piping isometric -->
        <path d="M1150 470L1316 566V410L1455 330V230"/>
        <path d="M1150 470L1080 430" class="bp-thin"/>
        <path d="M1225 505l10 -18M1260 525l10 -18M1316 470h18M1316 500h18M1385 382l10 18M1455 280h18"/>
        <path d="M1218 520L1254 504L1244 486L1208 502Z" class="bp-valve"/>
        <path d="M1390 384L1420 360L1406 344L1376 368Z" class="bp-valve"/>
        <circle cx="1316" cy="566" r="5"/><circle cx="1316" cy="410" r="5"/><circle cx="1455" cy="330" r="5"/>
        <path d="M1455 290H1500"/><circle cx="1520" cy="290" r="20"/>

        <!-- Flange detail -->
        <circle cx="560" cy="770" r="62"/><circle cx="560" cy="770" r="26"/>
        <circle cx="560" cy="770" r="46" class="bp-center"/>
        <circle cx="606" cy="770" r="5"/><circle cx="592.5" cy="802.5" r="5"/><circle cx="560" cy="816" r="5"/><circle cx="527.5" cy="802.5" r="5"/>
        <circle cx="514" cy="770" r="5"/><circle cx="527.5" cy="737.5" r="5"/><circle cx="560" cy="724" r="5"/><circle cx="592.5" cy="737.5" r="5"/>
        <path d="M480 770H640M560 690V850" class="bp-center"/>

        <!-- Title block -->
        <rect x="1270" y="770" width="310" height="110"/>
        <path d="M1270 800H1580M1270 830H1580M1270 855H1580M1462 800V880"/>
      </g>

      <g class="bp-text">
        <text x="98" y="455" transform="rotate(-90 98 455)">3 500</text>
        <text x="236" y="156">Ø 1 200</text>
        <text x="480" y="435">1</text>
        <text x="200" y="465">SORBENT BED</text>
        <text x="1176" y="452" transform="rotate(30 1176 452)">DN50 · STEAM</text>
        <text x="1508" y="295">PI</text>
        <text x="520" y="866">DETAIL A · FLANGE</text>
        <text x="1284" y="791">A. AHMED · DWG 001</text>
        <text x="1284" y="820">DAC REACTOR / STEAM</text>
        <text x="1284" y="848">ASME VIII DIV 1</text>
        <text x="1474" y="820">SCALE 1:20</text>
        <text x="1474" y="848">REV C</text>
        <text x="1284" y="873">AACHEN · 2026</text>
      </g>
    </svg>
    <div class="hero-glow" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="hero-photo">
        <span class="ring" aria-hidden="true"></span>
        <img id="heroPhoto" src="" alt="" width="168" height="168">
        <img class="hero-badge" src="assets/monogram.svg" alt="" width="40" height="40">
      </div>
      <p class="eyebrow" data-bind="location"></p>
      <h1 class="hero-name" data-bind="name"></h1>
      <p class="hero-role"><span id="typed"></span><span class="caret" aria-hidden="true"></span></p>
      <p class="hero-summary" data-bind="summary"></p>
      <div class="hero-cta" id="heroCta"></div>
      <div class="stats" id="stats"></div>
    </div>
    <a class="scroll-cue" href="#tabs" aria-label="Scroll to content"><span></span></a>
  </section>

  <div class="sheet">
  <main id="tabs">
    <div class="tabbar-wrap">
      <div class="tabbar" role="tablist" id="tabbar">
        <span class="tab-indicator" id="tabIndicator" aria-hidden="true"></span>
      </div>
    </div>
    <div class="panels" id="panels"></div>
  </main>

  <footer class="footer">
    <p>© <span id="year"></span> <span data-bind="name"></span> · Built with plain HTML, CSS &amp; JS · <a href="https://github.com/areebahmed401/my-portfolio">Source</a></p>
  </footer>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo" aria-hidden="true">
    <button class="lightbox-close" id="lightboxClose" type="button" aria-label="Close photo">×</button>
    <figure><img id="lightboxImg" src="" alt=""><figcaption id="lightboxCaption"></figcaption></figure>
  </div>

  <noscript><p class="noscript">This site needs JavaScript to display the CV content.</p></noscript>
  <!-- Bump ?v= when css/js change so browsers skip their cached copy -->
  <script src="js/main.js?v=6" defer></script>

</html>
