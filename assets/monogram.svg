<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AA truss monogram">
  <!-- Same truss geometry as the toolkit logo, in the portfolio's Carbon Green colours -->
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>
  <style>line{stroke-linecap:round}.chord{stroke:#34D399;stroke-width:3.4}.base{stroke:#A7F3D0;stroke-width:3.2}.bar{stroke:#5EEAD4;stroke-width:2.6}.web{stroke:#38BDF8;stroke-width:1.9}.pin{fill:#0B1F17;stroke:#E7F3EC;stroke-width:1.5}</style>
  <rect x="1.5" y="1.5" width="61" height="61" rx="15" fill="#0B1F17" stroke="url(#edge)" stroke-width="2"/>
  <g transform="translate(6.4 6.4) scale(.8)">
    <line class="base" x1="6" y1="54" x2="58" y2="54"/>
    <line class="chord" x1="6" y1="54" x2="19" y2="12"/>
    <line class="chord" x1="19" y1="12" x2="32" y2="54"/>
    <line class="chord" x1="32" y1="54" x2="45" y2="12"/>
    <line class="chord" x1="45" y1="12" x2="58" y2="54"/>
    <line class="chord" x1="19" y1="12" x2="45" y2="12"/>
    <line class="bar" x1="10.95" y1="38" x2="27.05" y2="38"/>
    <line class="bar" x1="36.95" y1="38" x2="53.05" y2="38"/>
    <line class="web" x1="10.95" y1="38" x2="19" y2="54"/>
    <line class="web" x1="27.05" y1="38" x2="19" y2="54"/>
    <line class="web" x1="36.95" y1="38" x2="45" y2="54"/>
    <line class="web" x1="53.05" y1="38" x2="45" y2="54"/>
    <circle class="pin" cx="6" cy="54" r="2.5"/>
    <circle class="pin" cx="32" cy="54" r="2.5"/>
    <circle class="pin" cx="58" cy="54" r="2.5"/>
    <circle class="pin" cx="19" cy="12" r="2.5"/>
    <circle class="pin" cx="45" cy="12" r="2.5"/>
    <circle class="pin" cx="10.95" cy="38" r="2.5"/>
    <circle class="pin" cx="27.05" cy="38" r="2.5"/>
    <circle class="pin" cx="36.95" cy="38" r="2.5"/>
    <circle class="pin" cx="53.05" cy="38" r="2.5"/>
    <circle class="pin" cx="19" cy="54" r="2.5"/>
    <circle class="pin" cx="45" cy="54" r="2.5"/>
